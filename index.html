<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tam Ekran Site</title>
    <style>
        /* Sayfadaki tüm varsayılan boşlukları ve kaydırma çubuklarını sıfırlıyoruz */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ana sayfada çift kaydırma çubuğu çıkmasını engeller */
        }

        /* Iframe'i ekranı tamamen kaplayacak şekilde ayarlıyoruz */
        .tam-ekran-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none; /* İframe'in etrafındaki çirkin çizgiyi kaldırır */
        }
    </style>
</head>
<body>

    <!-- src kısmına gömmek istediğin sitenin linkini yaz -->
    <iframe src="https://digitalcampus.dev-dsep.crescdi.pub.ro/" class="tam-ekran-iframe"></iframe>

</body>
</html>
